name: Custom ETF daily alerts
on:
  schedule:
    - cron: '30 23 * * 1-5'
  workflow_dispatch:
    inputs:
      send_test:
        description: 'Send Telegram test message (no buy signal required)'
        type: boolean
        required: false
        default: false
permissions:
  contents: write
concurrency:
  group: custom-etf-alerts
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test && '1' || '0' }}
        run: python notify.py
      - name: Save sent-alert history
        if: success()
        run: |
          if [ -f alert_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add alert_state.json
            git diff --cached --quiet || (git commit -m "Save alert history" && git pull --rebase && git push)
          fi
